<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thu Chi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F6FA">
<script>/* Áp giao diện sáng/tối trước khi vẽ trang để không bị nháy */
(function(){try{var p=localStorage.getItem('sothuchi.theme')||'auto';var d=p==='dark'||(p==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<meta name="description" content="Ghi chép dòng tiền vào, dòng tiền ra mỗi ngày">
<title>Sổ Thu Chi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="side" aria-label="Menu">
  <div class="sbrand"><div class="logo"><span data-ic="wallet"></span></div><div><b>Sổ Thu Chi</b><small>Quản lý dòng tiền cá nhân</small></div></div>
  <button class="sadd" data-act="add"><span data-ic="plus"></span>Thêm giao dịch</button>
  <nav id="sideNav"></nav>
  <div class="sfoot" id="sideFoot"></div>
</aside>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>

<nav class="nav" aria-label="Điều hướng chính">
  <div class="in">
    <button class="tab" data-act="tab" data-v="list" id="t-list"><span data-ic="list"></span>Giao dịch</button>
    <button class="tab" data-act="tab" data-v="stats" id="t-stats"><span data-ic="pie"></span>Thống kê</button>
    <button class="fab" data-act="add" aria-label="Thêm giao dịch"><span data-ic="plus"></span></button>
    <button class="tab" data-act="tab" data-v="budget" id="t-budget"><span data-ic="target"></span>Ngân sách</button>
    <button class="tab" data-act="tab" data-v="more" id="t-more"><span data-ic="grid"></span>Thêm<i class="tdot"></i></button>
  </div>
</nav>

<div class="overlay" id="overlay" data-act="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="grab"></div>
  <div class="shd">
    <h3 id="shTitle"></h3>
    <button class="iconbtn" data-act="close" aria-label="Đóng"><span data-ic="x"></span></button>
  </div>
  <div class="sbody" id="shBody"></div>
  <div class="sft" id="shFoot"></div>
</section>

<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="box">
    <div class="ei" id="dIcon"></div>
    <h4 id="dTitle"></h4>
    <p id="dText"></p>
    <div class="acts">
      <button class="btn sec2" data-act="dno">Hủy</button>
      <button class="btn danger" id="dOk" data-act="dyes">Xóa</button>
    </div>
  </div>
</div>

<div class="dp" id="dp" role="dialog" aria-modal="true" aria-label="Chọn ngày"><div class="dpbox" id="dpBox"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
